<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="AI copilot assistant">
  <style>
    .ic-ai-orbit {
      transform-box: fill-box;
      transform-origin: center;
      animation: ic-ai-rotate 1.9s linear infinite;
    }
    .ic-ai-core {
      transform-box: fill-box;
      transform-origin: center;
      animation: ic-ai-breath 1.8s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-ai-node {
      transform-box: fill-box;
      transform-origin: center;
      animation: ic-ai-pulse 1.8s ease-in-out infinite;
    }
    @keyframes ic-ai-rotate {
      0% { transform: rotate(0deg); opacity: 0.55; }
      50% { opacity: 0.95; }
      100% { transform: rotate(90deg); opacity: 0.55; }
    }
    @keyframes ic-ai-breath {
      0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.85; }
      50% { transform: scale(1.13) rotate(8deg); opacity: 1; }
    }
    @keyframes ic-ai-pulse {
      0%, 100% { transform: scale(0.75); opacity: 0.45; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ic-ai-orbit, .ic-ai-core, .ic-ai-node { animation: none !important; }
    }
  </style>
  <circle class="ic-ai-orbit" cx="24" cy="24" r="15.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path class="ic-ai-core" d="M24 11C25.2 18.6 29.4 22.8 37 24C29.4 25.2 25.2 29.4 24 37C22.8 29.4 18.6 25.2 11 24C18.6 22.8 22.8 18.6 24 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="currentColor" fill-opacity="0.22"/>
  <circle class="ic-ai-node" cx="35.5" cy="12.5" r="2.2" fill="currentColor"/>
</svg>
