<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Agent handbook">
  <style>
    .ic-hand-leaf {
      transform-box: fill-box;
      transform-origin: left bottom;
      animation: ic-hand-sway 1.7s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-hand-page {
      transform-box: fill-box;
      transform-origin: left center;
      animation: ic-hand-turn 1.7s ease-in-out infinite;
    }
    @keyframes ic-hand-sway {
      0%, 100% { transform: rotate(2deg) scale(0.95); opacity: 0.82; }
      50% { transform: rotate(-12deg) scale(1.12); opacity: 1; }
    }
    @keyframes ic-hand-turn {
      0%, 100% { transform: scaleX(1) skewY(0deg); }
      50% { transform: scaleX(0.86) skewY(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ic-hand-leaf, .ic-hand-page { animation: none !important; }
    }
  </style>
  <path d="M8.5 13C14 11.5 20.5 12.5 24 15.5V38C20.5 35.5 14 34.5 8.5 36V13Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="currentColor" fill-opacity="0.1"/>
  <path class="ic-hand-page" d="M39.5 13C34 11.5 27.5 12.5 24 15.5V38C27.5 35.5 34 34.5 39.5 36V13Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="currentColor" fill-opacity="0.06"/>
  <path class="ic-hand-leaf" d="M29 22.5C29 18.5 32 16 35.5 16.5C35.2 20 32.8 22.5 29 22.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="currentColor" fill-opacity="0.24"/>
  <path d="M13 20H19.5M13 25.5H19.5M29 28H35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
</svg>
