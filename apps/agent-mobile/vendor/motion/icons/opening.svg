<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Grand opening floral stand">
  <style>
    .ic-open-crown {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: ic-open-bloom 1.6s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-open-wing-l {
      transform-box: fill-box;
      transform-origin: right bottom;
      animation: ic-open-fl-l 1.6s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-open-wing-r {
      transform-box: fill-box;
      transform-origin: left bottom;
      animation: ic-open-fl-r 1.6s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-open-ribbon {
      transform-box: fill-box;
      transform-origin: center top;
      animation: ic-open-sway 1.6s ease-in-out infinite;
    }
    @keyframes ic-open-bloom {
      0%, 100% { transform: scale(0.94) translateY(0.5px); opacity: 0.88; }
      50% { transform: scale(1.14) translateY(-2px); opacity: 1; }
    }
    @keyframes ic-open-fl-l {
      0%, 100% { transform: rotate(2deg); }
      50% { transform: rotate(-11deg) scale(1.06); }
    }
    @keyframes ic-open-fl-r {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(11deg) scale(1.06); }
    }
    @keyframes ic-open-sway {
      0%, 100% { transform: rotate(-5deg); opacity: 0.72; }
      50% { transform: rotate(6deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ic-open-crown, .ic-open-wing-l, .ic-open-wing-r, .ic-open-ribbon { animation: none !important; }
    }
  </style>
  <path class="ic-open-wing-l" d="M21 20C15.5 19.5 12 16 12.5 11.5C17 11.8 20 15.2 21 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="currentColor" fill-opacity="0.16"/>
  <path class="ic-open-wing-r" d="M27 20C32.5 19.5 36 16 35.5 11.5C31 11.8 28 15.2 27 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="currentColor" fill-opacity="0.16"/>
  <path class="ic-open-crown" d="M24 7C27.2 10.6 27.2 16 24 20.5C20.8 16 20.8 10.6 24 7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="currentColor" fill-opacity="0.26"/>
  <rect x="14" y="21" width="20" height="5.5" rx="2.75" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.14"/>
  <path class="ic-open-ribbon" d="M20 26.5L18.5 34.5L21 32.8L23 34.8V26.5M28 26.5L29.5 34.5L27 32.8L25 34.8V26.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16.5 26.5L13.5 41M31.5 26.5L34.5 41M15.2 35.5H32.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
