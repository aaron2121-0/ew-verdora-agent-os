<style>.vl-outer,.vl-petal,.vl-core{transform-origin:50px 50px}.vl-outer{animation:o 32s linear infinite}.vl-petal{animation:b 6s ease-in-out var(--d,0s) infinite}.vl-core{animation:t 4.5s ease-in-out infinite}@keyframes o{to{transform:rotate(360deg)}}@keyframes b{50%{transform:scale(1.045) translateY(-1px)}}@keyframes t{50%{transform:scale(1.09) rotate(10deg);opacity:1}}@media(prefers-reduced-motion:reduce){.vl-outer,.vl-petal,.vl-core{animation:none!important}}</style>
