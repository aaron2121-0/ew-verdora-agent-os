<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>EW VERDORA Agent OS</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="celebrationLayer" class="celebration-layer hidden" aria-hidden="true"></div>
  <main class="app-root">
    <header id="topbar" class="topbar">
      <div class="brand-block">
        <div class="brand" data-i18n="brandName"></div>
        <div class="sub" data-i18n="agentWorkspace"></div>
      </div>
      <div class="top-actions">
        <button id="lang" class="btn btn-secondary btn-small" type="button"></button>
        <button id="logout" class="btn btn-text btn-small hidden" type="button" data-i18n="signOut"></button>
      </div>
    </header>

    <section id="login" class="auth-wrap">
      <div class="auth-brand-mark" aria-hidden="true"></div>
      <div class="auth-card">
        <h1 class="auth-title" data-i18n="loginTitle"></h1>
        <p class="auth-copy" data-i18n="loginDescription"></p>
        <input id="email" class="hidden" type="email" autocomplete="email">
        <button id="loginBtn" class="btn btn-primary hidden" type="button" data-i18n="sendSignIn"></button>
        <div id="loginMsg" class="auth-msg" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="register" class="auth-wrap hidden">
      <div class="auth-card">
        <h1 class="auth-title" data-i18n="registerTitle"></h1>
        <p class="auth-copy" data-i18n="registerDescription"></p>
        <label class="field-label" for="name" data-i18n="displayName"></label>
        <input id="name" autocomplete="name">
        <button id="regBtn" class="btn btn-primary btn-large" type="button" data-i18n="startTraining"></button>
        <div id="regMsg" class="auth-msg" role="status" aria-live="polite"></div>
      </div>
    </section>

    <div id="app" class="hidden">
      <section id="todayPage" class="section active" data-page="today"></section>
      <section id="customersPage" class="section" data-page="customers"></section>
      <section id="orderPage" class="section" data-page="order"></section>
      <section id="trainingPage" class="section" data-page="training"></section>
      <section id="performancePage" class="section" data-page="performance"></section>
      <section id="sellingPage" class="section" data-page="selling"></section>
    </div>
  </main>

  <nav id="nav" class="bottom-nav hidden" aria-label="Primary navigation"></nav>

  <div id="lockSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <div class="sheet-title-wrap">
          <span id="lockStatus" class="badge badge-warning"></span>
          <h2 id="lockTitle" class="sheet-title"></h2>
        </div>
        <button id="closeLock" class="btn btn-text btn-small" type="button" data-i18n="close"></button>
      </div>
      <p id="lockDesc" class="sheet-copy"></p>
      <div id="lockHow" class="unlock-note"></div>
      <button id="lockAction" class="btn btn-primary btn-large" type="button"></button>
    </div>
  </div>

  <div id="leadDetailSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="leadDetailHeading">
    <div class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="leadDetailHeading" class="sheet-title" data-i18n="customerDetails"></h2>
        <button id="closeLeadDetail" class="btn btn-text btn-small" type="button" data-i18n="close"></button>
      </div>
      <div id="leadDetailBody"></div>
    </div>
  </div>

  <div id="roleSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="roleTitle">
    <div class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="roleTitle" class="sheet-title" data-i18n="roleplay"></h2>
        <button id="closeRole" class="btn btn-text btn-small" type="button" data-i18n="close"></button>
      </div>
      <div id="scenario" class="chat"></div>
      <label class="field-label" for="roleAnswer" data-i18n="yourAnswer"></label>
      <textarea id="roleAnswer"></textarea>
      <button id="scoreRole" class="btn btn-primary btn-large" type="button" data-i18n="submit"></button>
      <div id="roleResult" class="notice hidden" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="confirmDialog" class="confirm-layer hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-card">
      <h2 id="confirmTitle" class="sheet-title"></h2>
      <p id="confirmMessage" class="sheet-copy"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn btn-secondary" type="button"></button>
        <button id="confirmOk" class="btn btn-primary" type="button"></button>
      </div>
    </div>
  </div>
</body>
</html>
