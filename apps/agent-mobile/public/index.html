<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>EW VERDORA Agent OS</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="brand">EW VERDORA</div>
        <div class="sub" data-i18n="appSubtitle"></div>
      </div>
      <div class="row">
        <button id="lang" class="btn btn-secondary btn-small" type="button"></button>
        <button id="logout" class="btn btn-secondary btn-small hidden" type="button" data-i18n="signOut"></button>
      </div>
    </header>

    <section id="login" class="card auth-card">
      <h1 class="title" data-i18n="loginTitle"></h1>
      <p class="muted" data-i18n="loginDescription"></p>
      <div class="form form-top">
        <input id="email" class="hidden" type="email" autocomplete="email">
        <button id="loginBtn" class="btn btn-primary hidden" type="button" data-i18n="sendSignIn"></button>
        <div id="loginMsg" class="muted" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="register" class="card hidden">
      <h1 class="title" data-i18n="registerTitle"></h1>
      <p class="muted" data-i18n="registerDescription"></p>
      <div class="form form-top">
        <label class="field-label" for="name" data-i18n="displayName"></label>
        <input id="name" autocomplete="name">
        <button id="regBtn" class="btn btn-primary" type="button" data-i18n="startTraining"></button>
        <div id="regMsg" class="muted" role="status" aria-live="polite"></div>
      </div>
    </section>

    <div id="app" class="hidden">
      <section class="section active" data-page="home">
        <div class="card">
          <div class="row row-between">
            <div>
              <div class="eyebrow" data-i18n="today"></div>
              <div id="hello" class="title"></div>
            </div>
            <span id="tier" class="badge"></span>
          </div>
          <div class="metric-grid metric-grid-four section-gap">
            <div><div class="muted" data-i18n="orders"></div><div id="orders" class="metric"></div></div>
            <div><div class="muted" data-i18n="qualifiedLeads"></div><div id="leadsN" class="metric"></div></div>
            <div><div class="muted" data-i18n="quotes"></div><div id="quotes" class="metric"></div></div>
            <div><div class="muted" data-i18n="followUps"></div><div id="follow" class="metric"></div></div>
          </div>
          <div id="mission" class="notice section-gap"></div>
        </div>

        <div id="campaignCard" class="card hidden">
          <h2 class="title" data-i18n="campaign"></h2>
          <div id="campaignList"></div>
        </div>

        <div class="card">
          <div class="row row-between">
            <h2 class="title" data-i18n="requiredTraining"></h2>
            <button id="practice" class="btn btn-secondary btn-small" type="button" data-i18n="aiPractice"></button>
          </div>
          <div id="trainingList"></div>
        </div>

        <div class="card">
          <h2 class="title" data-i18n="aiSalesCoach"></h2>
          <label class="field-label form-top" for="coachInput" data-i18n="customerMessage"></label>
          <textarea id="coachInput"></textarea>
          <button id="coachBtn" class="btn btn-primary button-top" type="button" data-i18n="askCoach"></button>
          <div id="coachOut" class="chat hidden section-gap" role="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="section" data-page="leads">
        <div class="card">
          <h2 class="title" data-i18n="newLead"></h2>
          <div class="form form-top">
            <label class="field-label" for="source" data-i18n="source"></label>
            <select id="source"></select>
            <label class="field-label" for="leadName" data-i18n="customerLabel"></label>
            <input id="leadName">
            <label class="field-label" for="category" data-i18n="category"></label>
            <select id="category"></select>
            <label class="field-label" for="occasion" data-i18n="occasionNotes"></label>
            <input id="occasion">
            <label class="field-label" for="budget" data-i18n="budgetRm"></label>
            <input id="budget" type="number" inputmode="decimal">
            <button id="saveLead" class="btn btn-primary" type="button" data-i18n="saveLead"></button>
            <div id="leadMsg" class="muted" role="status" aria-live="polite"></div>
          </div>
        </div>
        <div class="card">
          <h2 class="title" data-i18n="recentLeads"></h2>
          <div id="leadList"></div>
        </div>
      </section>

      <section class="section" data-page="kits">
        <div class="card">
          <h2 class="title" data-i18n="sellingKit"></h2>
          <p class="muted" data-i18n="sellingKitDescription"></p>
          <div id="dailyContent" class="chat hidden section-gap"></div>
          <div id="kitList"></div>
        </div>
        <div class="card">
          <h2 class="title" data-i18n="channelStrategy"></h2>
          <div id="playList"></div>
        </div>
      </section>

      <section class="section" data-page="wallet">
        <div class="card">
          <h2 class="title" data-i18n="wallet"></h2>
          <div class="metric-grid section-gap">
            <div><div class="muted" data-i18n="tier"></div><div id="walletTier" class="metric"></div></div>
            <div><div class="muted" data-i18n="score"></div><div id="walletScore" class="metric"></div></div>
          </div>
        </div>
        <div class="card">
          <h2 class="title" data-i18n="commissionHistory"></h2>
          <div id="commList"></div>
        </div>
      </section>
    </div>
  </main>

  <nav id="nav" class="nav hidden" aria-label="Primary">
    <button class="active" type="button" data-tab="home" data-i18n="navHome"></button>
    <button type="button" data-tab="leads" data-i18n="navLeads"></button>
    <button type="button" data-tab="kits" data-i18n="navSellingKit"></button>
    <button type="button" data-tab="wallet" data-i18n="navWallet"></button>
  </nav>

  <div id="roleSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="roleTitle">
    <div class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="row row-between">
        <h2 id="roleTitle" class="title" data-i18n="roleplay"></h2>
        <button id="closeRole" class="btn btn-text btn-small" type="button" data-i18n-aria="close" aria-label="Close">×</button>
      </div>
      <div id="scenario" class="chat section-gap"></div>
      <label class="field-label form-top" for="roleAnswer" data-i18n="yourAnswer"></label>
      <textarea id="roleAnswer"></textarea>
      <button id="scoreRole" class="btn btn-primary button-top" type="button" data-i18n="submit"></button>
      <div id="roleResult" class="notice hidden section-gap" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="quoteSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="quoteTitle">
    <div class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="row row-between">
        <h2 id="quoteTitle" class="title" data-i18n="referenceQuote"></h2>
        <button id="closeQuote" class="btn btn-text btn-small" type="button" data-i18n-aria="close" aria-label="Close">×</button>
      </div>
      <div id="uploadQuoteForm" class="form form-top">
        <label class="field-label" for="qBudget" data-i18n="customerBudget"></label>
        <input id="qBudget" type="number" inputmode="decimal">
        <label class="field-label" for="commit" data-i18n="designCommitment"></label>
        <select id="commit"></select>
        <label class="field-label" for="refFile" data-i18n="referenceImage"></label>
        <input id="refFile" type="file" accept="image/jpeg,image/png,image/webp">
        <button id="quoteBtn" class="btn btn-primary" type="button" data-i18n="uploadAnalyze"></button>
      </div>
      <div id="readyQuoteForm" class="form hidden form-top">
        <div id="readyQuoteText" class="notice"></div>
        <button id="budgetQuoteBtn" class="btn btn-primary" type="button"></button>
        <button id="recommendedQuoteBtn" class="btn btn-secondary" type="button"></button>
      </div>
      <div id="quoteOut" class="notice hidden section-gap" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="confirmDialog" class="confirm-layer hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-card">
      <h2 id="confirmTitle" class="title"></h2>
      <p id="confirmMessage" class="muted"></p>
      <div class="row row-end section-gap">
        <button id="confirmCancel" class="btn btn-secondary" type="button"></button>
        <button id="confirmOk" class="btn btn-primary" type="button"></button>
      </div>
    </div>
  </div>
</body>
</html>
