<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Hand-tied floral bouquet">
  <style>
    .ic-bouq-head {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: ic-bouq-breath 1.7s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-bouq-leaf-l {
      transform-box: fill-box;
      transform-origin: right bottom;
      animation: ic-bouq-unfurl-l 1.7s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-bouq-leaf-r {
      transform-box: fill-box;
      transform-origin: left bottom;
      animation: ic-bouq-unfurl-r 1.7s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    @keyframes ic-bouq-breath {
      0%, 100% { transform: scale(0.95) translateY(0.5px); }
      50% { transform: scale(1.1) translateY(-2px); }
    }
    @keyframes ic-bouq-unfurl-l {
      0%, 100% { transform: rotate(2deg); opacity: 0.75; }
      50% { transform: rotate(-11deg) scale(1.06); opacity: 1; }
    }
    @keyframes ic-bouq-unfurl-r {
      0%, 100% { transform: rotate(-2deg); opacity: 0.75; }
      50% { transform: rotate(11deg) scale(1.06); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ic-bouq-head, .ic-bouq-leaf-l, .ic-bouq-leaf-r { animation: none !important; }
    }
  </style>
  <path class="ic-bouq-leaf-l" d="M18.5 22C13 21.5 9.5 18 10 13C14.8 13.5 18 17 18.5 22Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="currentColor" fill-opacity="0.16"/>
  <path class="ic-bouq-leaf-r" d="M29.5 22C35 21.5 38.5 18 38 13C33.2 13.5 30 17 29.5 22Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="currentColor" fill-opacity="0.16"/>
  <g class="ic-bouq-head">
    <circle cx="24" cy="14" r="5" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.2"/>
    <circle cx="17.5" cy="18.5" r="4" stroke="currentColor" stroke-width="1.7" fill="currentColor" fill-opacity="0.14"/>
    <circle cx="30.5" cy="18.5" r="4" stroke="currentColor" stroke-width="1.7" fill="currentColor" fill-opacity="0.14"/>
  </g>
  <path d="M13 23.5L24 41.5L35 23.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.1"/>
  <path d="M17.5 31H30.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M24 31V41.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
</svg>
