<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Condolence floral wreath">
  <style>
    .ic-cond-aura {
      transform-box: fill-box;
      transform-origin: center;
      animation: ic-cond-pulse 1.8s ease-in-out infinite;
    }
    .ic-cond-petal-l {
      transform-box: fill-box;
      transform-origin: right bottom;
      animation: ic-cond-open-l 1.8s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-cond-petal-r {
      transform-box: fill-box;
      transform-origin: left bottom;
      animation: ic-cond-open-r 1.8s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-cond-center {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: ic-cond-breath 1.8s ease-in-out infinite;
    }
    @keyframes ic-cond-pulse {
      0%, 100% { transform: scale(0.92) rotate(0deg); opacity: 0.35; }
      50% { transform: scale(1.08) rotate(12deg); opacity: 0.95; }
    }
    @keyframes ic-cond-open-l {
      0%, 100% { transform: rotate(2deg) scale(0.96); }
      50% { transform: rotate(-10deg) translateY(-1px) scale(1.08); }
    }
    @keyframes ic-cond-open-r {
      0%, 100% { transform: rotate(-2deg) scale(0.96); }
      50% { transform: rotate(10deg) translateY(-1px) scale(1.08); }
    }
    @keyframes ic-cond-breath {
      0%, 100% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.12) translateY(-1px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ic-cond-aura, .ic-cond-petal-l, .ic-cond-petal-r, .ic-cond-center { animation: none !important; }
    }
  </style>
  <circle class="ic-cond-aura" cx="24" cy="22" r="14.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3.5"/>
  <circle cx="24" cy="22" r="10.5" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.1"/>
  <path class="ic-cond-petal-l" d="M24 23C19.5 22.5 16.5 19 17.5 14.5C21 15 23.5 18.5 24 23Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="currentColor" fill-opacity="0.2"/>
  <path class="ic-cond-petal-r" d="M24 23C28.5 22.5 31.5 19 30.5 14.5C27 15 24.5 18.5 24 23Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="currentColor" fill-opacity="0.2"/>
  <path class="ic-cond-center" d="M24 12.5C26.2 15.6 26.2 19.6 24 23C21.8 19.6 21.8 15.6 24 12.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="currentColor" fill-opacity="0.28"/>
  <path d="M18 31.5L15.5 41M30 31.5L32.5 41M24 32.5V40" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M19.5 35.5H28.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>
