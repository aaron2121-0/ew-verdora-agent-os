<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Floral wholesale supply">
  <style>
    .ic-whol-stems {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: ic-whol-rise 1.6s cubic-bezier(.34,1.3,.64,1) infinite;
    }
    .ic-whol-crate {
      transform-box: fill-box;
      transform-origin: center;
      animation: ic-whol-settle 1.6s ease-in-out infinite;
    }
    @keyframes ic-whol-rise {
      0%, 100% { transform: translateY(1px) scale(0.95); opacity: 0.84; }
      50% { transform: translateY(-2.8px) scale(1.08); opacity: 1; }
    }
    @keyframes ic-whol-settle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(1px) scale(1.02, 0.97); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ic-whol-stems, .ic-whol-crate { animation: none !important; }
    }
  </style>
  <g class="ic-whol-stems">
    <path d="M17 22V14M24 22V11.5M31 22V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="17" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity="0.2"/>
    <circle cx="24" cy="9.5" r="3.2" stroke="currentColor" stroke-width="1.7" fill="currentColor" fill-opacity="0.24"/>
    <circle cx="31" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6" fill="currentColor" fill-opacity="0.2"/>
  </g>
  <g class="ic-whol-crate">
    <rect x="9.5" y="22.5" width="29" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.1"/>
    <path d="M9.5 28H38.5M18 33.5H30" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
