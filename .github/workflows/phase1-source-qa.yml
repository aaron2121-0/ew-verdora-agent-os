name: Phase 1 Source QA

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-mobile/**"
      - "supabase/functions/agent-session/**"
      - "supabase/functions/quote-intake/**"
      - "supabase/functions/agent-training/**"
      - "supabase/migrations/20261113_phase3_training_mcq_certification.sql"
      - "scripts/training-bank-import.mjs"
      - "supabase/migrations/20261113_phase1_agent_mobile_overview.sql"
      - ".github/workflows/phase1-source-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check native module syntax
        run: |
          for file in apps/agent-mobile/public/*.js apps/agent-mobile/tests/phase1-*.mjs; do
            node --check "$file"
          done
      - name: Run Phase 1 + Phase 2 + Phase 3 source/security tests
        run: node --test apps/agent-mobile/tests/phase1-security.test.mjs apps/agent-mobile/tests/phase2-security.test.mjs apps/agent-mobile/tests/phase3-security.test.mjs apps/agent-mobile/tests/phase3-seed-import.test.mjs
      - name: Reject inline event attributes
        run: |
          if grep -RniE ' on[a-z]+=' apps/agent-mobile/public/index.html; then
            echo "Inline event attribute found"
            exit 1
          fi
      - name: Reject unsafe HTML sinks
        run: |
          if grep -RniE '\.innerHTML[[:space:]]*=|insertAdjacentHTML'             apps/agent-mobile/public/app.js             apps/agent-mobile/public/phase1.js             apps/agent-mobile/public/order.js \
            apps/agent-mobile/public/performance.js \
            apps/agent-mobile/public/training.js; then
            echo "Unsafe HTML sink found"
            exit 1
          fi
