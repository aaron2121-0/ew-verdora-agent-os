name: Phase 0 Live QA
# Phase 0 acceptance rerun marker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase0-live-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      AGENT_URL: https://agent-mobile-production.up.railway.app
      OWNER_URL: https://owner-mobile-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for Railway health
        shell: bash
        run: |
          set -euo pipefail
          for url in "$AGENT_URL/health" "$OWNER_URL/health"; do
            for i in $(seq 1 20); do
              if curl -fsS "$url" >/dev/null; then break; fi
              if [ "$i" -eq 20 ]; then echo "Health failed: $url"; exit 1; fi
              sleep 3
            done
          done

      - name: Verify live CSP and split assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/agent_headers "$AGENT_URL/" -o /tmp/agent.html
          grep -qi '^content-security-policy:' /tmp/agent_headers
          grep -qi "object-src 'none'" /tmp/agent_headers
          grep -qi "frame-ancestors 'none'" /tmp/agent_headers
          for asset in styles.css app.js i18n.js icons.js components.js; do
            curl -fsS "$AGENT_URL/$asset" >/dev/null
          done
          curl -fsS -D /tmp/owner_headers "$OWNER_URL/" -o /tmp/owner.html
          grep -qi '^content-security-policy:' /tmp/owner_headers

      - name: Install open-source browser QA tools
        run: |
          npm install --no-save playwright lighthouse
          npx playwright install --with-deps chromium

      - name: Run 360/430 bilingual browser E2E and XSS checks
        run: node apps/agent-mobile/tests/live-phase0.mjs

      - name: Run Lighthouse mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/phase0
          CHROME_PATH="$(node -e "const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          "$CHROME_PATH" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            about:blank >/tmp/phase0-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              cat /tmp/phase0-chrome.log
              exit 1
            fi
            sleep 1
          done
          npx lighthouse "$AGENT_URL" \
            --config-path=apps/agent-mobile/tests/lighthouse.config.cjs \
            --port=9222 \
            --output=json \
            --output-path=docs/phase0/lighthouse.json \
            --quiet
          node apps/agent-mobile/tests/check-lighthouse.mjs

      - name: Build short Phase 0 GIF
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y -framerate 1 -pattern_type glob -i 'docs/phase0/gif-*.png'             -vf "fps=8,scale=430:-1:flags=lanczos"             -loop 0 docs/phase0/phase0-agent-foundation.gif >/tmp/ffmpeg.log 2>&1

      - name: Commit Phase 0 QA evidence
        shell: bash
        run: |
          rm -f docs/phase0/gif-*.png
          git config user.name "EW VERDORA QA"
          git config user.email "qa@users.noreply.github.com"
          git add docs/phase0
          if git diff --cached --quiet; then
            echo "No QA evidence changes"
            exit 0
          fi
          git commit -m "Phase 0 QA evidence"
          git pull --rebase origin main
          git push
