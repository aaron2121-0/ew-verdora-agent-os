name: Bootstrap canonical source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-canonical.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble canonical source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk*.txt > /tmp/ewv-source.b64
          base64 --decode /tmp/ewv-source.b64 > /tmp/ewv-source.zip
          unzip -t /tmp/ewv-source.zip
          unzip -o /tmp/ewv-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-canonical.yml

      - name: Commit exact canonical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EW VERDORA Bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore canonical Claude/GPT source snapshot"
          git push origin HEAD:main
