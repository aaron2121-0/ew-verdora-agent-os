name: Phase 1 Build Railway Bundle

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-mobile/public/**"
      - "apps/agent-mobile/build-railway-function.mjs"
      - ".github/workflows/phase1-build-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-build-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Build compressed Railway Function
        run: node apps/agent-mobile/build-railway-function.mjs
      - name: Verify generated bundle size and syntax
        run: |
          test -f apps/agent-mobile/dist/railway-function.ts
          bytes=$(wc -c < apps/agent-mobile/dist/railway-function.ts)
          echo "Bundle bytes: $bytes"
          test "$bytes" -lt 380000
          node --check apps/agent-mobile/dist/railway-function.ts
      - name: Commit generated bundle
        run: |
          git config user.name "EW VERDORA Build"
          git config user.email "build@users.noreply.github.com"
          git add -f apps/agent-mobile/dist/railway-function.ts
          if git diff --cached --quiet; then
            echo "Bundle unchanged"
            exit 0
          fi
          git commit -m "Phase 1 build: compressed Railway bundle"
          git pull --rebase origin main
          git push
