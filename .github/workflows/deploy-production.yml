name: Production auto-deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'apps/agent-mobile/public/**'
      - 'apps/agent-mobile/vendor/**'
      - 'content/handbook/**'
      - 'content/onboarding/kyc_copy.json'
      - 'apps/agent-mobile/build-railway-function.mjs'
      - 'apps/agent-mobile/dist/railway-function.ts'
      - 'apps/agent-mobile/railway-loader.ts'
      - 'apps/agent-mobile/package.json'
      - 'apps/owner-mobile/index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/phase1-build-bundle.yml'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: '首次启用：Owner 确认当前线上正常版本的完整 40 位 commit SHA；之后留空'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  loader-commit:
    # GITHUB_TOKEN writes normally do not trigger push workflows; explicit guard
    # also protects installations using another bot credential in the future.
    if: github.ref == 'refs/heads/main' && !(github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, '[production-loader]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for bundle and commit immutable loader pins
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy/prepare.py

  deploy:
    needs: loader-commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.loader-commit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Install official pinned Railway CLI
        run: npm install --global @railway/cli@5.74.0
      - name: Deploy, check, and roll back on any deployment or check failure
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: python3 scripts/deploy/release.py
