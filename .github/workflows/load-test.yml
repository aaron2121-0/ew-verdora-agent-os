name: Manual read-only k6 load test

on:
  workflow_dispatch:
    inputs:
      agent_mobile_url:
        description: "Agent Mobile origin (HTTPS, no trailing path)"
        required: true
        type: string
      owner_mobile_url:
        description: "Owner Mobile origin (HTTPS, no trailing path)"
        required: true
        type: string
      supabase_url:
        description: "Supabase project origin (HTTPS)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate target origins
        env:
          AGENT_URL: ${{ inputs.agent_mobile_url }}
          OWNER_URL: ${{ inputs.owner_mobile_url }}
          SUPABASE_URL: ${{ inputs.supabase_url }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          for key in ('AGENT_URL','OWNER_URL','SUPABASE_URL'):
              value = os.environ[key]
              p = urlsplit(value)
              if p.scheme != 'https' or not p.hostname or p.username or p.password or p.query or p.fragment or p.path not in ('','/'):
                  raise SystemExit(f'Invalid HTTPS origin: {key}')
          PY

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Prepare read-only scenario
        run: |
          cat > /tmp/read-only.js <<'JS'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          const unexpected = new Rate('unexpected_response_rate');
          const agent = __ENV.AGENT_URL.replace(/\/$/, '');
          const owner = __ENV.OWNER_URL.replace(/\/$/, '');
          const supabase = __ENV.SUPABASE_URL.replace(/\/$/, '');
          const targets = [
            { url: agent + '/health', method: 'GET', expected: [200] },
            { url: agent + '/config', method: 'GET', expected: [200] },
            { url: agent + '/', method: 'GET', expected: [200] },
            { url: owner + '/health', method: 'GET', expected: [200] },
            { url: supabase + '/functions/v1/agent-session', method: 'POST', expected: [401] },
            { url: supabase + '/functions/v1/owner-session', method: 'POST', expected: [401] },
          ];
          export const options = {
            stages: [
              { duration: '1m', target: 10 },
              { duration: '1m', target: 50 },
              { duration: '1m', target: 100 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<800'],
              unexpected_response_rate: ['rate<0.01'],
            },
            noConnectionReuse: false,
          };
          export default function () {
            // The only POSTs are unauthenticated requests with an empty JSON object.
            // They MUST be rejected with 401; no credentials or writable actions are sent.
            const t = targets[(__ITER + __VU) % targets.length];
            const response = t.method === 'POST'
              ? http.post(t.url, '{}', { headers: { 'Content-Type': 'application/json' }, redirects: 0 })
              : http.get(t.url, { redirects: 0 });
            const ok = t.expected.includes(response.status);
            unexpected.add(!ok);
            check(response, { 'expected status': () => ok });
            // Realistic pacing: ~1 request/second per virtual user (protects free quotas).
            sleep(1);
          }
          export function handleSummary(data) {
            return { '/tmp/k6-summary.json': JSON.stringify(data, null, 2) };
          }
          JS

      - name: Run manual load test
        id: run
        continue-on-error: true
        env:
          AGENT_URL: ${{ inputs.agent_mobile_url }}
          OWNER_URL: ${{ inputs.owner_mobile_url }}
          SUPABASE_URL: ${{ inputs.supabase_url }}
        run: k6 run --quiet /tmp/read-only.js

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-readonly-summary
          path: /tmp/k6-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce thresholds
        if: steps.run.outcome != 'success'
        run: |
          echo 'k6 load test failed or threshold was exceeded'
          exit 1
