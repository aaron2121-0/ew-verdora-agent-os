name: Phase 4 Live Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-live-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bootstrap isolated QA agents
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {createHash}=require("node:crypto");
          const url="https://vuibesuahnhlafsfraeo.supabase.co";
          const pub="sb_publishable_1Z2QQaYdZdeF5svF1bJPHA_zjXVa14j";
          const emails=["qa-phase4-a-33690a4e@example.com","qa-phase4-b-33690a4e@example.com"];

          async function invoke(name,body,token){
            const headers={"apikey":pub,"Content-Type":"application/json"};
            if(token) headers.Authorization="Bearer "+token;
            const res=await fetch(url+"/functions/v1/"+name,{method:"POST",headers,body:JSON.stringify(body)});
            const text=await res.text();
            let data={}; try{data=text?JSON.parse(text):{};}catch{}
            if(!res.ok) throw new Error(name+"_"+res.status+"_"+String(data.error||"failed"));
            return data;
          }

          (async()=>{
            const out=[];
            for(let i=0;i<emails.length;i++){
              const email=emails[i];
              const code=createHash("sha256").update(email).digest("hex");
              const auth=await invoke("agent-auth",{action:"invite_session",email,code});
              if(!auth.access_token||!auth.user_id) throw new Error("invite_session_missing_token");
              console.log("::add-mask::"+auth.access_token);
              if(auth.refresh_token) console.log("::add-mask::"+auth.refresh_token);
              const reg=await invoke("agent-session",{action:"register",display_name:"QA Phase4 "+(i?"B":"A"),language:"en"},auth.access_token);
              if(!reg.agent_id) throw new Error("register_missing_agent");
              out.push({email,user_id:auth.user_id,agent_id:reg.agent_id});
            }
            console.log("QA_BOOTSTRAP "+JSON.stringify(out));
          })().catch(e=>{console.error("PHASE4_BOOTSTRAP_FAIL",e.message);process.exitCode=1;});
          NODE
